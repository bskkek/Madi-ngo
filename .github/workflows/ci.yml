name: Madingo Phase 1-4 CI/CD Pipeline

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main]

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript & Lint Check
        run: npm run lint

      - name: Validate Curriculum & Phase 4 Content (40 Badges, Cosmetics, Exams, Legal)
        run: npx tsx scripts/validate-phase4-content.ts

      - name: Run Unit Test Suites (Phases 1-4 Pure Logic)
        run: npx tsx --test src/lib/rules.test.ts src/lib/phase2.test.ts src/lib/phase3Engine.test.ts src/lib/phase4Engine.test.ts

      - name: Build Production Bundle
        run: npm run build
