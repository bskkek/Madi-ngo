<title>madingo - MADI crew (animated)</title>
<!--
  MADI CREW - animated component for the madingo landing page ("Meet the crew" section).
  HOW TO USE: copy the <section class="crew-wrap"> block + the <style> + the <script> into the landing page.
  - The 5 characters are cut-out sprites (embedded as base64 WebP here; transparent PNGs are provided separately).
  - Do NOT redraw or replace the characters. Only the CSS/JS may be adjusted.
  - Language: set <html lang="ru|en|ar|fr">; speech bubbles follow it. Add more phrases in the I18N object.
  - Animations respect prefers-reduced-motion. Tap/click a character = it jumps and says a phrase.
-->
<style>
  :root { --ink:#0A1F44; --blue:#0B3D91; --orange:#FF8A1F; --page:#F7F9FC; --disc:#EFE9DF; --bubble:#fff; }
  @media (prefers-color-scheme: dark) { :root { --page:#0D1526; --disc:#16213A; --bubble:#F7F9FC; } }
  * { box-sizing:border-box; }
  html,body { margin:0; background:var(--page); font-family:"Nunito","Noto Sans Arabic","Inter",system-ui,sans-serif; }
  .crew-wrap { padding:24px 16px; display:grid; place-items:center; overflow:hidden; }
  .crew { position:relative; width:100%; max-width:920px; aspect-ratio:2231/1145; container-type:inline-size; direction:ltr; }
  .crew::before { content:""; position:absolute; inset:2% 14% 0 14%; border-radius:50%; background:var(--disc); opacity:.9; }
  .fig { position:absolute; padding:0; border:0; background:none; cursor:pointer; -webkit-tap-highlight-color:transparent;
          opacity:0; transform:translateY(8%) scale(.92); transform-origin:50% 100%;
          animation:enter .7s cubic-bezier(.2,.9,.3,1.2) forwards; animation-delay:calc(.15s + var(--i)*.14s); }
  .fig:focus-visible { outline:3px solid var(--orange); outline-offset:4px; border-radius:12px; }
  .fig img { display:block; width:100%; height:auto; user-select:none; -webkit-user-drag:none; transform-origin:50% 100%; }
  .bob { display:block; transform-origin:50% 100%; animation:var(--idle) var(--dur) ease-in-out infinite; animation-delay:calc(var(--i)*.35s); }
  .shadow { position:absolute; left:8%; right:8%; bottom:-1.2%; height:3.2%; border-radius:50%; background:rgba(10,31,68,.18); filter:blur(2px); animation:shadow var(--dur) ease-in-out infinite; animation-delay:calc(var(--i)*.35s); }
  .f-girl      { --idle:wave;   --dur:2.2s; }
  .f-professor { --idle:breathe;--dur:4.2s; }
  .f-kid       { --idle:hop;    --dur:2.6s; }
  .f-builder   { --idle:sway;   --dur:3.4s; }
  .f-engineer  { --idle:lean;   --dur:3.8s; }
  @keyframes enter   { to { opacity:1; transform:none; } }
  @keyframes wave    { 0%,100% { transform:rotate(-2.5deg) translateY(0); } 50% { transform:rotate(3deg) translateY(-2.5%); } }
  @keyframes breathe { 0%,100% { transform:scale(1,1); } 50% { transform:scale(1.012,1.018); } }
  @keyframes hop     { 0%,60%,100% { transform:translateY(0) scale(1,1); } 20% { transform:translateY(-7%) scale(.97,1.04); } 40% { transform:translateY(0) scale(1.03,.97); } }
  @keyframes sway    { 0%,100% { transform:rotate(-1.2deg) scale(1,1); } 50% { transform:rotate(1.2deg) scale(1.01,1.015); } }
  @keyframes lean    { 0%,100% { transform:rotate(1.4deg); } 50% { transform:rotate(-1.6deg) translateY(-1%); } }
  @keyframes shadow  { 0%,100% { transform:scaleX(1); opacity:1; } 50% { transform:scaleX(.92); opacity:.8; } }
  .fig.jump img { animation:jump .55s cubic-bezier(.3,.8,.3,1); }
  @keyframes jump { 0% { transform:none; } 30% { transform:translateY(-12%) scale(.96,1.07); } 60% { transform:translateY(0) scale(1.06,.93); } 100% { transform:none; } }
  .bubble { position:absolute; bottom:calc(100% + 1%); left:50%; transform:translate(-50%,6px) scale(.9); opacity:0; pointer-events:none; white-space:nowrap;
             padding:.35em .8em; border-radius:999px; background:var(--bubble); color:var(--ink); border:2px solid var(--ink);
             font-weight:800; font-size:clamp(11px,2.7cqw,17px); transition:opacity .2s, transform .2s; direction:auto; z-index:3; }
  .bubble::after { content:""; position:absolute; left:50%; top:100%; width:.6em; height:.6em; background:inherit; border:inherit; border-top:0; border-left:0; transform:translate(-50%,-55%) rotate(45deg); }
  .fig.talk .bubble { opacity:1; transform:translate(-50%,0) scale(1); }
  .car { position:absolute; animation:drive 5s ease-in-out infinite; }
  .car img { display:block; width:100%; height:auto; }
  @keyframes drive { 0%,100% { transform:translate(-30%,0); } 50% { transform:translate(30%,-6%); } }
  @media (prefers-reduced-motion: reduce) {
    .fig { animation:none; opacity:1; transform:none; }
    .bob,.shadow,.car { animation:none; }
    .fig.jump img { animation:none; }
  }
</style>
</head>

<script>
(function(){
  var I18N = {

  };
  var NAMES = { girl:"Sonya", professor:"Professor", kid:"Misha", builder:"Dima", engineer:"Katya" }; // placeholders, rename freely
  var lang = (document.documentElement.lang || "en").slice(0,2); if(!I18N.girl[lang]) lang="en";
  var figs = [].slice.call(document.querySelectorAll(".fig"));
  figs.forEach(function(f){
    var id=f.dataset.id; f.querySelector(".bubble").textContent=I18N[id][lang]; f.setAttribute("aria-label", NAMES[id]+": "+I18N[id][lang]);
  });
  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    clearTimeout(f._t); f._t=setTimeout(function(){ f.classList.remove("talk"); f.classList.remove("jump"); }, 1900); }
  figs.forEach(function(f){ f.addEventListener("click", function(){ speak(f); }); });

    var visible=false, n=0;
    new IntersectionObserver(function(e){ visible=e[0].isIntersecting; },{threshold:.4}).observe(document.getElementById("crew"));

  }
})();
